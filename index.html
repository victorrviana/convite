<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um Convite Especial ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
    }
    h1 { color: #d63384; margin-bottom: 10px; font-size: 1.8rem; }
    p { color: #555; line-height: 1.5; }
    
    /* Botões */
    .btn-group {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 15px;
      min-height: 50px;
      position: relative;
    }
    button {
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-yes {
      background-color: #ff4757;
      color: white;
    }
    .btn-yes:hover {
      transform: scale(1.05);
      background-color: #ff6b81;
    }
    .btn-no {
      background-color: #747d8c;
      color: white;
      position: absolute;
    }

    /* Ocultar Seções */
    .hidden { display: none !important; }

    /* Barra de Carregamento (Loading) */
    .progress-bar {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-fill {
      height: 20px;
      background-color: #ff4757;
      width: 0%;
      transition: width 0.5s ease;
    }
    
    /* Formulário de Agendamento */
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      color: #444;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #ff4757;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- PASSO 1: A PERGUNTA (BOTÃO FUJÃO) -->
    <div id="step-1">
      <h1>Pergunta de Extrema Importância! 💌</h1>
      <p>Achei que um simples texto no WhatsApp não estaria à altura. Então... Você aceita sair comigo?</p>
      
      <div class="btn-group" id="btn-container">
        <button class="btn-yes" onclick="iniciarAnalise()">SIM! ✨</button>
        <button class="btn-no" id="no-btn" onmouseover="fugirBotao()" onclick="fugirBotao()">NÃO 😜</button>
      </div>
    </div>

    <!-- PASSO 2: ANÁLISE DE COMPATIBILIDADE -->
    <div id="step-2" class="hidden">
      <h1>Analisando Dados... 🔍</h1>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <p id="loading-status">Calculando afinidade...</p>
    </div>

    <!-- PASSO 3: ESCOLHA DA DATA E HORA -->
    <div id="step-3" class="hidden">
      <h1>Resultado: 100% Match! 🎉</h1>
      <p>Já que você aceitou, agora escolhe como e quando vai ser:</p>
      
      <div class="form-group">
        <label for="data">Qual é o melhor dia?</label>
        <input type="date" id="data">
      </div>

      <div class="form-group">
        <label for="hora">Qual horário você prefere?</label>
        <input type="time" id="hora">
      </div>

      <div class="form-group">
        <label for="opcao">O que vamos fazer?</label>
        <select id="opcao">
          <option value="Tomar um café aconchegante ☕">Tomar um café ☕</option>
          <option value="Jantar num lugar legal 🍕">Jantar 🍕</option>
          <option value="Tomar um drink ou cerveja 🍹">Tomar um drink 🍹</option>
          <option value="Sorvete e caminhada 🍦">Sorvete e caminhada 🍦</option>
          <option value="Você escolhe o lugar! 🤫">Surpresa (Você escolhe)</option>
        </select>
      </div>

      <button class="btn-yes" style="width: 100%; margin-top: 10px;" onclick="enviarWhatsApp()">Confirmar</button>
    </div>

  </div>

  <script>
    // Configuração do seu WhatsApp
    // Coloque seu número com DDD (Apenas números, ex: 5547999999999)
    const SEU_NUMERO_WHATSAPP = "5547988660822"; 

    // Posição inicial do botão 'Não'
    const noBtn = document.getElementById('no-btn');
    const btnContainer = document.getElementById('btn-container');

    // Ajusta o botão 'Não' para ficar ao lado do 'Sim' inicialmente
    noBtn.style.left = (btnContainer.offsetWidth / 2 + 10) + 'px';

    function fugirBotao() {
      const containerRect = btnContainer.getBoundingClientRect();
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Limita o movimento dentro do container para não sumir da tela
      const maxX = window.innerWidth - btnWidth - 20;
      const maxY = window.innerHeight - btnHeight - 20;

      const randomX = Math.floor(Math.random() * (maxX - 20)) + 10;
      const randomY = Math.floor(Math.random() * (maxY - 20)) + 10;

      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    function iniciarAnalise() {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');

      const statusText = document.getElementById('loading-status');
      const progressFill = document.getElementById('progress');

      const etapas = [
        { pct: '25%', text: 'Analisando sorrisos...' },
        { pct: '50%', text: 'Calculando paciência para minhas piadas...' },
        { pct: '75%', text: 'Verificando química no ar...' },
        { pct: '100%', text: 'Resultado: Compatibilidade Perfeita!' }
      ];

      let i = 0;
      const interval = setInterval(() => {
        if (i < etapas.length) {
          progressFill.style.width = etapas[i].pct;
          statusText.innerText = etapas[i].text;
          i++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
          }, 600);
        }
      }, 700);
    }

    function enviarWhatsApp() {
      const dataVal = document.getElementById('data').value;
      const horaVal = document.getElementById('hora').value;
      const opcaoVal = document.getElementById('opcao').value;

      if (!dataVal || !horaVal) {
        alert("Por favor, selecione uma data e horário!");
        return;
      }

      // Formatar a data para o padrão BR (dd/mm/aaaa)
      const dataFormatada = dataVal.split('-').reverse().join('/');

      // Mensagem personalizada que chegará no seu WhatsApp
      const mensagem = `Oi! Aceitei seu convite! 😉%0A%0A📅 *Data:* ${dataFormatada}%0A⏰ *Horário:* ${horaVal}%0A🎯 *Programa:* ${opcaoVal}%0A%0AMe avisa se tá combinado!`;

      // Abrir o WhatsApp
      const url = `https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${mensagem}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
